<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F3F0FA">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Study Planner">
    <title>Sign in | Med Study Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 22px;
            font-family: 'Figtree', system-ui, sans-serif; color: #3A3752;
            background:
                radial-gradient(800px 400px at 85% -10%, #FBE4EA 0%, transparent 60%),
                radial-gradient(700px 380px at -5% 0%, #DDEFF9 0%, transparent 60%),
                #F3F0FA;
        }
        .card {
            width: min(380px, 100%); background: #fff; border-radius: 24px; padding: 30px;
            box-shadow: 0 12px 30px rgba(124, 105, 201, 0.12);
        }
        h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 1.7rem; margin: 0 0 6px; }
        p { margin: 0 0 20px; color: #6E6A8A; }
        label { display: block; font-weight: 500; font-size: 0.93rem; margin-bottom: 6px; }
        input {
            width: 100%; padding: 12px 14px; border: 2px solid #E8E3F4; border-radius: 12px;
            background: #FBFAFE; font: 1rem 'Figtree', sans-serif; color: #3A3752; margin-bottom: 14px;
        }
        input:focus { outline: none; border-color: #C6B7F0; }
        button {
            width: 100%; border: none; border-radius: 12px; padding: 12px 18px; cursor: pointer;
            font: 600 1rem 'Figtree', sans-serif; color: #3A3752; background: #D8CCF5;
        }
        button:hover { background: #C6B7F0; }
        :focus-visible { outline: 3px solid #7C69C9; outline-offset: 2px; }
        .error { margin: 0 0 14px; padding: 10px 14px; border-radius: 12px; background: #FFE3E8; color: #B4506A; font-size: 0.93rem; }
    </style>
</head>
<body>
    <form class="card" method="post">
        <h1>Med Study Planner</h1>
        <p>Enter the password to open your planner.</p>
        {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autofocus autocomplete="current-password">
        <button type="submit">Open planner</button>
    </form>
</body>
</html>
